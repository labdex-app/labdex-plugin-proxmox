name: Release

# Publish a release whose tag matches plugin.yaml (v1.3 for version 1.3), in the web UI
# or with `gh release create v1.3 --target main --notes ""`: the plugin is signed with the
# LABDEX_SIGNING_KEY secret (an Ed25519 key from `labdex plugin keygen`; for official
# plugins the labdex project key) and attached to that release as <id>-<version>.zip.
# Files listed in .releaseignore stay out of the zip. The release description gets that
# version's CHANGELOG.md section (below anything you wrote), and CHANGELOG.md is attached. A Marketplace
# (labdex plugin build-index) picks the release up from there.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install labdex (for signing)
        run: pip install "labdex @ git+https://github.com/labdex-app/labdex@main#subdirectory=backend"
      - name: Check the tag against plugin.yaml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, yaml
          m = yaml.safe_load(open("plugin.yaml"))
          tag = os.environ["TAG"]
          if tag != f"v{m['version']}":
              raise SystemExit(f"::error::tag {tag}, but plugin.yaml says version {m['version']}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ID={m['id']}\nVER={m['version']}\n")
          PY
      - name: Sign and pack
        env:
          LABDEX_SIGNING_KEY: ${{ secrets.LABDEX_SIGNING_KEY }}
          LABDEX_DATA: ${{ runner.temp }}/labdex-data
        run: |
          if [ -z "$LABDEX_SIGNING_KEY" ]; then echo "::error::add the LABDEX_SIGNING_KEY secret"; exit 1; fi
          mkdir -p "build/$ID" && git archive HEAD | tar -x -C "build/$ID"   # what's committed
          labdex plugin prune "build/$ID"   # minus what .releaseignore lists (and .github, .gitignore …)
          umask 077; printf '%s\n' "$LABDEX_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          labdex plugin sign "build/$ID" --key "$RUNNER_TEMP/key.pem" --signer "${{ vars.LABDEX_SIGNER || github.repository_owner }}"
          rm -f "$RUNNER_TEMP/key.pem"
          labdex plugin pack "build/$ID" -o "$ID-$VER.zip"
      - name: Release notes from CHANGELOG.md
        env:
          BODY: ${{ github.event.release.body }}
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["VER"]
          log = open("CHANGELOG.md").read() if os.path.exists("CHANGELOG.md") else ""
          m = re.search(rf"^##+\s*\[?v?{re.escape(v)}\]?\b[^\n]*\n(.*?)(?=^##+\s|\Z)", log, re.M | re.S)
          section = m.group(1).strip() if m else ""
          body = os.environ.get("BODY", "").strip()
          parts = [body] if body else []
          if section and section not in body:
              parts.append(f"## Changes in {v}\n\n{section}" if body else section)
          open("notes.md", "w").write("\n\n".join(parts) or f"{os.environ['ID']} {v}")
          PY
      - name: Attach the signed plugin and the changelog to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp CHANGELOG.md "$ID-CHANGELOG.md" 2>/dev/null || true
          gh release upload "$TAG" "$ID-$VER.zip" $(ls "$ID-CHANGELOG.md" 2>/dev/null) --clobber
          gh release edit "$TAG" --notes-file notes.md   # what you wrote, then this version's CHANGELOG section
      - name: Tell the Marketplace (optional)
        # a fine-grained token with Actions: write on the Marketplace repository (secret MARKETPLACE_TOKEN,
        # variable MARKETPLACE_REPO, e.g. labdex-app/labdex-plugins); without it the Marketplace
        # picks the release up on its next scheduled run
        if: ${{ vars.MARKETPLACE_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "no MARKETPLACE_TOKEN: the Marketplace picks it up on its next run"; exit 0; fi
          gh api "repos/${{ vars.MARKETPLACE_REPO }}/dispatches" -f event_type=plugin-released
